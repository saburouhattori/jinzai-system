<script>
function searchData() {
  let rawId = document.getElementById('searchId').value.trim();
  if (!rawId) { showModal('管理番号を入力してください。'); return; }
  let adminId = formatId(rawId);
  document.getElementById('searchId').value = adminId;
  document.getElementById('searchBtn').disabled = true;
  showModal('検索中...', true);
  
  google.script.run.withSuccessHandler(function(data) {
    closeModal(); document.getElementById('searchBtn').disabled = false;
    if (data) {
      document.getElementById('targetRow').value = data.row;
      
      const fields = ['name','furigana','nickname','birthday','gender','spouse','height','weight',
                      'address','birthplace','email','school','eduSchool','eduDept','eduStatus',
                      'eduStart','eduEnd','eduNote',
                      'expContent1','expContent2','expContent3','jlptLevel','jlptDate','jftLevel','jftDate',
                      'kaigoSkill','kaigoSkillDate','kaigoLang','kaigoLangDate','otherExam',
                      'otherExamDate','otherJapanese','otherJapaneseDate','comment'];
      
      fields.forEach(f => { 
        let el = document.getElementById(f); 
        if(el) { 
          let val = data[f] || ""; 
          if(typeof val === 'string' && val.startsWith("'")) val = val.substring(1); 
          
          if (el.type === 'month' && typeof val === 'string') {
            let match = val.match(/(\d{4})[-\/年](\d{1,2})/);
            if (match) {
              val = match[1] + '-' + match[2].padStart(2, '0');
            }
          }
          el.value = val; 
        } 
      });
      
      // ▼▼ 職歴期間の読み込み（文字列から年月へ分割セット） ▼▼
      [1, 2, 3].forEach(i => {
        let pVal = data['expPeriod' + i] || "";
        let sEl = document.getElementById('expPeriod' + i + '_start');
        let eEl = document.getElementById('expPeriod' + i + '_end');
        if (sEl && eEl) {
           let matches = [...pVal.matchAll(/(\d{4})[-\/年](\d{1,2})/g)];
           if (matches.length === 1 && pVal.trim().startsWith('〜')) {
              sEl.value = "";
              eEl.value = matches[0][1] + '-' + matches[0][2].padStart(2, '0');
           } else {
              sEl.value = matches.length >= 1 ? matches[0][1] + '-' + matches[0][2].padStart(2, '0') : "";
              eEl.value = matches.length >= 2 ? matches[1][1] + '-' + matches[1][2].padStart(2, '0') : "";
           }
        }
      });
      
      let relSel = document.getElementById('relativeSelect'); let relDet = document.getElementById('relativeDetail');
      if (data.relative && data.relative !== "日本に家族や親戚はいません。" && data.relative !== "無" && data.relative !== "なし") {
        relSel.value = "有"; relDet.value = data.relative; relDet.style.display = "block";
      } else { relSel.value = "無"; relDet.value = ""; relDet.style.display = "none"; }
      
      showModal(data.name + ' さんのデータを読み込みました。');
    } else { showModal('該当するデータが見つかりません。'); }
  }).safeSearchByAdminId(adminId);
}

function searchDataAddInfo() {
  let rawId = document.getElementById('searchIdAddInfo').value.trim();
  if (!rawId) { showModal('管理番号を入力してください。'); return; }
  let adminId = formatId(rawId);
  document.getElementById('searchIdAddInfo').value = adminId;
  showModal('検索中...', true);
  
  google.script.run.withSuccessHandler(function(data) {
    closeModal();
    if (data) {
      document.getElementById('targetRow').value = data.row;
      const fields = ['agent', 'offerDate', 'birthCity', 'addressDetail', 'passportNum', 'passportExp', 'job', 'traineeExp', 'traineeCert', 'crime', 'applyCount', 'rejectCount', 'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate', 'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'];
      fields.forEach(f => { let el = document.getElementById('add_' + f); if(el) { let val = data[f] || ""; if(typeof val === 'string' && val.startsWith("'")) val = val.substring(1); el.value = val; } });
      showModal(data.name + ' さんのデータを読み込みました。\n採用後の追加情報を入力してください。');
    } else { showModal('該当するデータが見つかりません。'); }
  }).safeSearchByAdminId(adminId);
}

function submitAddInfo() {
  let row = document.getElementById('targetRow').value;
  if (!row) { showModal('先に管理番号で検索して、データを読み込んでください。'); return; }
  let formData = { row: row };
  const fields = ['agent', 'offerDate', 'birthCity', 'addressDetail', 'passportNum', 'passportExp', 'job', 'traineeExp', 'traineeCert', 'crime', 'applyCount', 'rejectCount', 'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate', 'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'];
  
  fields.forEach(f => { 
    let el = document.getElementById('add_' + f); 
    if (el) {
      let val = el.value;
      if (typeof val === 'string') {
        val = val.split('\n').map(line => line.replace(/\u3000/g, ' ').replace(/ +/g, ' ').trim()).join('\n');
      }
      if (f === 'birthCity') {
        formData[f] = val.toUpperCase();
      } else if (f === 'passportNum') {
        formData[f] = val.replace(/[^a-zA-Z0-9]/g, '');
      } else {
        formData[f] = val; 
      }
    }
  });
  
  showModal('保存中...', true);
  google.script.run.withSuccessHandler(function(msg) { 
    showModal(msg, false, true);
    google.script.run.syncListSheets();
  }).updateAddInfoRow(formData);
}

function submitData() {
  let formData = {};
  
  const fields = ['name','furigana','nickname','birthday','gender','spouse','height','weight','address','birthplace','email','school','eduSchool','eduDept','eduStatus','eduStart','eduEnd','eduNote','expContent1','expContent2','expContent3','jlptLevel','jlptDate','jftLevel','jftDate','kaigoSkill','kaigoSkillDate','kaigoLang','kaigoLangDate','otherExam','otherExamDate','otherJapanese','otherJapaneseDate','comment'];
  fields.forEach(f => { 
    let el = document.getElementById(f); 
    if(el) {
      let val = el.value;
      if (typeof val === 'string') {
        val = val.split('\n').map(line => line.replace(/\u3000/g, ' ').replace(/ +/g, ' ').trim()).join('\n');
      }
      formData[f] = val; 
    } 
  });
  
  // ▼▼ 職歴期間の結合保存 ▼▼
  [1, 2, 3].forEach(i => {
    let sEl = document.getElementById('expPeriod' + i + '_start');
    let eEl = document.getElementById('expPeriod' + i + '_end');
    let sVal = sEl && sEl.value ? sEl.value.split('-')[0] + "年" + parseInt(sEl.value.split('-')[1], 10) + "月" : "";
    let eVal = eEl && eEl.value ? eEl.value.split('-')[0] + "年" + parseInt(eEl.value.split('-')[1], 10) + "月" : "";
    
    let combined = "";
    if (sVal && eVal) combined = sVal + " 〜 " + eVal;
    else if (sVal) combined = sVal + " 〜";
    else if (eVal) combined = "〜 " + eVal;
    
    formData['expPeriod' + i] = combined;
  });
  
  let relSel = document.getElementById('relativeSelect'); let relDet = document.getElementById('relativeDetail');
  if (relSel && relDet) {
    let relVal = relDet.value;
    if (typeof relVal === 'string') {
      relVal = relVal.split('\n').map(line => line.replace(/\u3000/g, ' ').replace(/ +/g, ' ').trim()).join('\n');
    }
    formData.relative = (relSel.value === '有') ? relVal : "日本に家族や親戚はいません。";
  }
  
  if (MODE === 'EDIT') {
    formData.row = document.getElementById('targetRow').value;
    if (!formData.row) { showModal('先に管理番号で検索してください。'); return; }
  }
  
  let fileInput = document.getElementById('imageFile');
  if (fileInput && fileInput.files.length > 0) {
    let file = fileInput.files[0];
    let reader = new FileReader();
    reader.onload = function(e) { formData.imageFile = { name: file.name, mimeType: file.type, contents: e.target.result.split(',')[1] }; sendData(formData); };
    reader.readAsDataURL(file);
  } else { sendData(formData); }
}

function sendData(formData) {
  document.getElementById('mainBtn').disabled = true; showModal('処理中...', true);
  if (MODE === 'NEW') { google.script.run.withSuccessHandler(onSuccess).addNewRow(formData); } 
  else { google.script.run.withSuccessHandler(onSuccess).updateRow(formData); }
}

function onSuccess(msg) {
  document.getElementById('mainBtn').disabled = false; 
  showModal(msg, false, true);

  if (MODE === 'NEW') {
    let inputs = document.querySelectorAll('input[type="text"], input[type="date"], input[type="number"], input[type="email"], input[type="month"], textarea');
    inputs.forEach(input => input.value = '');
    let selects = document.querySelectorAll('select'); selects.forEach(select => select.selectedIndex = 0);
    let fileInput = document.getElementById('imageFile'); if (fileInput) fileInput.value = '';
    document.getElementById('relativeDetail').style.display = 'none';
  }
  google.script.run.syncListSheets();
}

function submitDelete() {
  let rawId = document.getElementById('delete_id').value.trim();
  if (!rawId) { showModal('削除するIDを入力してください。'); return; }
  let adminId = formatId(rawId);
  if (!confirm(adminId + " のデータを完全に削除します。よろしいですか？")) return;
  showModal('削除中...', true);
  google.script.run.withSuccessHandler(function(msg) {
    showModal(msg, false, true);
    document.getElementById('delete_id').value = ''; 
    document.getElementById('deleteNameDisplay').innerText = '';
    google.script.run.syncListSheets();
  }).deleteCandidate(adminId);
}
</script>
