<div id="form-addinfo" style="display: <?= mode === 'ADDINFO' ? 'block' : 'none' ?>;">
  <div class="search-box" style="max-width: 400px; margin-bottom: 20px;">
    <label>管理番号で検索</label>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="searchIdAddInfo" placeholder=" 例: 1 または 0001 " oninput="checkCandId(this, 'searchNameAddInfo')" onblur="applyFormat(this)" style="flex: 2;">
      <button class="btn-secondary" onclick="searchDataAddInfo()" style="flex: 1; margin-top: 0; padding: 8px;">読み込む</button>
    </div>
    <div id="searchNameAddInfo" style="font-size:11px; color:#1a73e8; margin-top:4px; height:14px;"></div>
  </div>

  <div class="section-title">採用後スケジュール</div>
  <div class="form-row">
    <div class="field"><label>入国日</label><input type="date" id="add_entryDate"></div>
    <div class="field"><label>入職日</label><input type="date" id="add_workDate"></div>
    <div class="field flex-2"></div>
  </div>

  <div class="section-title">基本・パスポート情報</div>
  <div class="form-row">
    <div class="field"><label>所属送り出し機関</label><select id="add_agent"><option value="">未選択</option></select></div>
    <div class="field"><label>出生地（都市名）</label><input type="text" id="add_birthCity" oninput="this.value = this.value.toUpperCase();"></div>
    <div class="field"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>住所詳細</label><input type="text" id="add_addressDetail" style="width: 100%;"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>パスポート番号</label><input type="text" id="add_passportNum" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');"></div>
    <div class="field"><label>パスポート有効期限</label><input type="date" id="add_passportExp"></div>
    <div class="field flex-2"></div>
  </div>
  
  <div class="section-title">経歴・申請歴</div>
  <div class="form-row">
    <div class="field">
      <label>職業</label>
      <select id="add_job">
        <option value="">未選択</option>
        <option value="会社員">会社員</option>
        <option value="アルバイト">アルバイト</option>
        <option value="無職">無職</option>
      </select>
    </div>
    <div class="field"><label>技能実習の経験の有無</label><select id="add_traineeExp"><option value="">未選択</option><option value="有">有</option><option value="無">無</option></select></div>
    <div class="field"><label>技能実習修了書の有無</label><select id="add_traineeCert"><option value="">未選択</option><option value="有">有</option><option value="無">無</option></select></div>
    <div class="field"><label>犯罪歴の有無</label><select id="add_crime"><option value="">未選択</option><option value="有">有</option><option value="無">無</option></select></div>
  </div>
  <div class="form-row">
    <div class="field"><label>交付申請の回数</label><input type="number" id="add_applyCount" placeholder="例: 0"></div>
    <div class="field"><label>不許可の回数</label><input type="number" id="add_rejectCount" placeholder="例: 0"></div>
    <div class="field"><label>海外出入国歴の有無</label><select id="add_overseasExp"><option value="">未選択</option><option value="有">有</option><option value="無">無</option></select></div>
    <div class="field"><label>出入国の回数</label><input type="number" id="add_travelCount" placeholder="例: 0"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>直近の入国日</label><input type="date" id="add_lastInDate"></div>
    <div class="field"><label>直近の出国日</label><input type="date" id="add_lastOutDate"></div>
    <div class="field flex-2"></div>
  </div>

  <div class="section-title">日本在住の親族情報</div>
  <div class="form-row">
    <div class="field"><label>親族の名前</label><input type="text" id="add_relName2"></div>
    <div class="field"><label>続柄</label><input type="text" id="add_relRelation2"></div>
    <div class="field"><label>親族の生年月日</label><input type="date" id="add_relBirth2"></div>
    <div class="field"><label>国籍・地域</label><input type="text" id="add_relCountry2"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>同居予定の有無</label><select id="add_relLive2"><option value="">未選択</option><option value="有">有</option><option value="無">無</option></select></div>
    <div class="field flex-2"><label>勤務先・通学先</label><input type="text" id="add_relWork2"></div>
    <div class="field"><label>在留カード番号</label><input type="text" id="add_relCard2"></div>
  </div>

  <div class="section-title">備考</div>
  <div class="field"><label>備考・メモ</label><textarea id="add_memo" rows="2"></textarea></div>

  <div style="text-align: center; margin-top: 20px;">
    <button class="btn-primary" onclick="submitAddInfo()" style="width: 200px;">追加情報を保存</button>
  </div>
</div>
