<script>
// =========================================
// COE申請情報の登録・更新 (ADDINFO)
// =========================================

function validateAddNameInput(val) {
  const warningEl = document.getElementById('add_name_warning');
  if (!warningEl) return;
  if (val && /[()（）0-9０-９]/.test(val)) {
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }
}

function searchDataAddInfo() {
  let rawId = document.getElementById('searchIdAddInfo').value.trim();
  if (!rawId) { showModal('管理番号を入力してください。\nPlease enter the ID.'); return; }
  rawId = toHalfWidthNumber(rawId);
  let adminId = formatId(rawId);
  document.getElementById('searchIdAddInfo').value = adminId;
  showModal('検索中... / Searching...', true);
  
  google.script.run.withSuccessHandler(function(data) {
    closeModal();
    if (data) {
      document.getElementById('targetRow').value = data.row;
      const fields = [
        'name', 'nickname', 'birthday', 'gender', 'spouse',
        'eduSchool', 'eduDept', 'eduStatus', 'eduEnd',
        'jlptLevel', 'jftLevel', 'kaigoSkill', 'kaigoLang', 'otherExam', 'otherJapanese',
        'agent', 'birthCity', 'addressDetail', 'passportNum', 'passportExp',
        'job', 'traineeExp', 'traineeCert', 'crime', 'applyCount', 'rejectCount',
        'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate',
        'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'
      ];
      fields.forEach(f => {
        let el = document.getElementById('add_' + f);
        if (el) {
          let val = data[f] || "";
          if (typeof val === 'string' && val.startsWith("'")) val = val.substring(1);
          if (el.type === 'month' && typeof val === 'string') {
            let match = val.match(/(\d{4})[-\/年](\d{1,2})/);
            if (match) {
              val = match[1] + '-' + match[2].padStart(2, '0');
            }
          }
          el.value = val;
        }
      });

      const addNameEl = document.getElementById('add_name');
      if (addNameEl) validateAddNameInput(addNameEl.value);

      showModal(data.name + ' さんのデータを読み込みました。\nCOE申請情報を確認・入力してください。\n\nData loaded. Please verify and enter the COE application info.');
    } else { showModal('該当するデータが見つかりません。\nNo matching data found.'); }
  }).safeSearchByAdminId(adminId);
}

function submitAddInfo() {
  let row = document.getElementById('targetRow').value;
  if (!row) { showModal('先に管理番号で検索して、データを読み込んでください。\nPlease search by ID and load data first.'); return; }
  let formData = { row: row };
  const fields = [
    'name', 'nickname', 'birthday', 'gender', 'spouse',
    'eduSchool', 'eduDept', 'eduStatus', 'eduEnd',
    'jlptLevel', 'jftLevel', 'kaigoSkill', 'kaigoLang', 'otherExam', 'otherJapanese',
    'agent', 'birthCity', 'addressDetail', 'passportNum', 'passportExp',
    'job', 'traineeExp', 'traineeCert', 'crime', 'applyCount', 'rejectCount',
    'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate',
    'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'
  ];
  
  fields.forEach(f => { 
    let el = document.getElementById('add_' + f); 
    if (el) {
      let val = el.value;
      if (typeof val === 'string') {
        val = toHalfWidthNumber(val);
        val = val.split('\n').map(line => line.replace(/\u3000/g, ' ').replace(/ +/g, ' ').trim()).join('\n');
      }
      if (f === 'name' || f === 'birthCity') {
        val = val.toUpperCase();
        el.value = val;
        formData[f] = val;
      } else if (f === 'passportNum') {
        formData[f] = val.replace(/[^a-zA-Z0-9]/g, '');
      } else {
        formData[f] = val; 
      }
    }
  });

  if (formData.name && /[()（）0-9０-９]/.test(formData.name)) {
    validateAddNameInput(formData.name);
    showModal('名前にカッコや数字を含めることはできません。\nDo not include parentheses or numbers in the name.');
    return;
  }
  
  showModal('保存中... / Saving...', true);
  google.script.run.withSuccessHandler(function(msg) { 
    showModal(msg, false, true);
    const searchIdEl = document.getElementById('searchIdAddInfo');
    if (searchIdEl && searchIdEl.value.trim() && candidateDict) {
      const editId = formatId(toHalfWidthNumber(searchIdEl.value.trim())).replace(/\s/g, '').toUpperCase();
      if (candidateDict[editId]) {
        if (formData.name) candidateDict[editId].name = formData.name;
        if (formData.birthday) candidateDict[editId].birthday = formData.birthday;
      }
    }
    google.script.run.syncListSheets();
  }).updateAddInfoRow(formData);
}
</script>
