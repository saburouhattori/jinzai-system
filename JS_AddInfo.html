<script>
// =========================================
// COE申請情報の登録・更新 (ADDINFO)
// =========================================

function validateAddNameInput(val) {
  const warningEl = document.getElementById('add_name_warning');
  if (!warningEl) return;
  if (val && /[()（）0-9０-９]/.test(val)) {
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }
}

/**
 * 入力フィールドの有効/無効（グレーアウト）を切り替えるヘルパー関数
 */
function setAddFieldDisabled_(fieldId, wrapId, isDisabled, clearOnDisable = false) {
  const el = document.getElementById(fieldId);
  const wrap = wrapId ? document.getElementById(wrapId) : (el ? el.closest('.field') : null);
  if (el) {
    el.disabled = isDisabled;
    if (isDisabled && clearOnDisable) {
      el.value = '';
    }
  }
  if (wrap) {
    if (isDisabled) wrap.classList.add('field-disabled');
    else wrap.classList.remove('field-disabled');
  }
}

/**
 * 採用案件の「技能分野」に応じて関係のない試験プルダウンをグレーアウト（選択不可）にする関数
 */
function applySkillFieldExamControl(skillField) {
  const sf = String(skillField || '').trim();
  if (sf === '介護') {
    setAddFieldDisabled_('add_kaigoSkill', 'field_wrap_kaigoSkill', false, false);
    setAddFieldDisabled_('add_kaigoLang', 'field_wrap_kaigoLang', false, false);
    setAddFieldDisabled_('add_foodServiceExam', 'field_wrap_foodServiceExam', true, true);
    setAddFieldDisabled_('add_foodMfgExam', 'field_wrap_foodMfgExam', true, true);
  } else if (sf === '外食業') {
    setAddFieldDisabled_('add_kaigoSkill', 'field_wrap_kaigoSkill', true, true);
    setAddFieldDisabled_('add_kaigoLang', 'field_wrap_kaigoLang', true, true);
    setAddFieldDisabled_('add_foodServiceExam', 'field_wrap_foodServiceExam', false, false);
    setAddFieldDisabled_('add_foodMfgExam', 'field_wrap_foodMfgExam', true, true);
  } else if (sf === '飲食料品製造業') {
    setAddFieldDisabled_('add_kaigoSkill', 'field_wrap_kaigoSkill', true, true);
    setAddFieldDisabled_('add_kaigoLang', 'field_wrap_kaigoLang', true, true);
    setAddFieldDisabled_('add_foodServiceExam', 'field_wrap_foodServiceExam', true, true);
    setAddFieldDisabled_('add_foodMfgExam', 'field_wrap_foodMfgExam', false, false);
  } else {
    // 技能分野が未設定またはその他の場合はすべて入力可能にする
    setAddFieldDisabled_('add_kaigoSkill', 'field_wrap_kaigoSkill', false, false);
    setAddFieldDisabled_('add_kaigoLang', 'field_wrap_kaigoLang', false, false);
    setAddFieldDisabled_('add_foodServiceExam', 'field_wrap_foodServiceExam', false, false);
    setAddFieldDisabled_('add_foodMfgExam', 'field_wrap_foodMfgExam', false, false);
  }
}

/**
 * 過去のCOE交付申請歴の有無（有 / 無）に応じた回数欄のグレーアウト制御
 */
function toggleAddApplyFields() {
  const sel = document.getElementById('add_applyExp');
  const val = sel ? sel.value : '';
  const isNo = (val === '無');
  setAddFieldDisabled_('add_applyCount', 'field_wrap_applyCount', isNo, true);
  setAddFieldDisabled_('add_rejectCount', 'field_wrap_rejectCount', isNo, true);
}

/**
 * 過去の出入国歴の有無（有 / 無）に応じた回数・日付欄のグレーアウト制御
 */
function toggleAddOverseasFields() {
  const sel = document.getElementById('add_overseasExp');
  const val = sel ? sel.value : '';
  const isNo = (val === '無');
  setAddFieldDisabled_('add_travelCount', 'field_wrap_travelCount', isNo, true);
  setAddFieldDisabled_('add_lastInDate', 'field_wrap_lastInDate', isNo, true);
  setAddFieldDisabled_('add_lastOutDate', 'field_wrap_lastOutDate', isNo, true);
}

/**
 * 在日親族及び同居者の有無（有 / 無）に応じた親族詳細7項目のグレーアウト制御
 */
function toggleAddRelFields() {
  const sel = document.getElementById('add_relExp2');
  const val = sel ? sel.value : '';
  const isNo = (val === '無');
  const relFields = ['relRelation2', 'relName2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2'];
  relFields.forEach(f => {
    setAddFieldDisabled_('add_' + f, null, isNo, true);
  });
}

function searchDataAddInfo() {
  let rawId = document.getElementById('searchIdAddInfo').value.trim();
  if (!rawId) { showModal('管理番号を入力してください。\nPlease enter the ID.'); return; }
  rawId = toHalfWidthNumber(rawId);
  let adminId = formatId(rawId);
  document.getElementById('searchIdAddInfo').value = adminId;
  showModal('検索中... / Searching...', true);
  
  google.script.run.withSuccessHandler(function(data) {
    closeModal();
    const refBox = document.getElementById('add_ref_job_box');
    if (data) {
      document.getElementById('targetRow').value = data.row;

      // 採用案件の参考情報（案件ID・採用事業者名・技能分野・内定日）の表示
      if (refBox) {
        refBox.style.display = 'block';
        const jIdEl = document.getElementById('ref_hiredJobId');
        const compEl = document.getElementById('ref_hiredCompany');
        const skillEl = document.getElementById('ref_hiredSkillField');
        const oDateEl = document.getElementById('ref_offerDate');
        if (jIdEl) jIdEl.innerText = data.hiredJobId || '未設定 / Not set';
        if (compEl) compEl.innerText = data.hiredCompany || '未設定 / Not set';
        if (skillEl) skillEl.innerText = data.hiredSkillField || '未設定 / Not set';
        if (oDateEl) oDateEl.innerText = data.offerDate || '未設定 / Not set';
      }

      // 最終学歴の日本語登録値（参考表示のみ）のセット
      const eduSchoolJpEl = document.getElementById('ref_eduSchoolJp');
      const eduDeptJpEl = document.getElementById('ref_eduDeptJp');
      if (eduSchoolJpEl) eduSchoolJpEl.innerText = data.eduSchool || '未登録 / Not registered';
      if (eduDeptJpEl) eduDeptJpEl.innerText = data.eduDept || '未登録 / Not registered';

      const fields = [
        'name', 'nickname', 'birthday', 'gender', 'spouse',
        'eduSchoolEn', 'eduDeptEn', 'eduStatus', 'eduEnd',
        'jlptLevel', 'jftLevel', 'kaigoSkill', 'kaigoLang', 'foodServiceExam', 'foodMfgExam', 'otherJapanese',
        'agent', 'birthCity', 'addressDetail', 'passportNum', 'passportExp',
        'job', 'traineeExp', 'traineeCert', 'crime',
        'applyExp', 'applyCount', 'rejectCount',
        'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate',
        'relExp2', 'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'
      ];
      fields.forEach(f => {
        let el = document.getElementById('add_' + f);
        if (el) {
          let val = data[f] || "";
          if (typeof val === 'string' && val.startsWith("'")) val = val.substring(1);
          if (f === 'nickname' && typeof val === 'string') {
            val = val.replace(/\(/g, '（').replace(/\)/g, '）');
          }
          if (el.type === 'month' && typeof val === 'string') {
            let match = val.match(/(\d{4})[-\/年](\d{1,2})/);
            if (match) {
              val = match[1] + '-' + match[2].padStart(2, '0');
            }
          }
          el.value = val;
        }
      });

      // 技能分野に応じた試験項目のグレーアウトおよび有無プルダウン連動の適用
      applySkillFieldExamControl(data.hiredSkillField);
      toggleAddApplyFields();
      toggleAddOverseasFields();
      toggleAddRelFields();

      const addNameEl = document.getElementById('add_name');
      if (addNameEl) validateAddNameInput(addNameEl.value);

      showModal(data.name + ' さんのデータを読み込みました。\nCOE申請情報を確認・入力してください。\n\nData loaded. Please verify and enter the COE application info.');
    } else {
      if (refBox) refBox.style.display = 'none';
      showModal('該当するデータが見つかりません。\nNo matching data found.');
    }
  }).safeSearchByAdminId(adminId);
}

function submitAddInfo() {
  let row = document.getElementById('targetRow').value;
  if (!row) { showModal('先に管理番号で検索して、データを読み込んでください。\nPlease search by ID and load data first.'); return; }
  let formData = { row: row };
  const fields = [
    'name', 'nickname', 'birthday', 'gender', 'spouse',
    'eduSchoolEn', 'eduDeptEn', 'eduStatus', 'eduEnd',
    'jlptLevel', 'jftLevel', 'kaigoSkill', 'kaigoLang', 'foodServiceExam', 'foodMfgExam', 'otherJapanese',
    'agent', 'birthCity', 'addressDetail', 'passportNum', 'passportExp',
    'job', 'traineeExp', 'traineeCert', 'crime',
    'applyExp', 'applyCount', 'rejectCount',
    'overseasExp', 'travelCount', 'lastInDate', 'lastOutDate',
    'relExp2', 'relName2', 'relRelation2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2', 'memo'
  ];
  
  fields.forEach(f => { 
    let el = document.getElementById('add_' + f); 
    if (el) {
      let val = el.disabled ? "" : el.value;
      if (typeof val === 'string') {
        val = val.normalize('NFC');
        val = toHalfWidthNumber(val);
        val = val.split('\n').map(line => line.replace(/\u3000/g, ' ').replace(/ +/g, ' ').trim()).join('\n');
      }
      if (f === 'name' || f === 'birthCity' || f === 'eduSchoolEn' || f === 'eduDeptEn') {
        val = val.toUpperCase();
        if (!el.disabled) el.value = val;
        formData[f] = val;
      } else if (f === 'nickname') {
        val = val.replace(/\(/g, '（').replace(/\)/g, '）').replace(/\s+（/g, '（');
        if (!el.disabled) el.value = val;
        formData[f] = val;
      } else if (f === 'passportNum') {
        formData[f] = val.replace(/[^a-zA-Z0-9]/g, '');
      } else {
        formData[f] = val; 
      }
    }
  });

  // 「無」が選択されている場合の値クリア保証
  if (formData.applyExp === '無') {
    formData.applyCount = '0';
    formData.rejectCount = '0';
  }
  if (formData.overseasExp === '無') {
    formData.travelCount = '';
    formData.lastInDate = '';
    formData.lastOutDate = '';
  }
  if (formData.relExp2 === '無') {
    ['relRelation2', 'relName2', 'relBirth2', 'relCountry2', 'relLive2', 'relWork2', 'relCard2'].forEach(k => formData[k] = '');
  }

  if (formData.name && /[()（）0-9０-９]/.test(formData.name)) {
    validateAddNameInput(formData.name);
    showModal('名前にカッコや数字を含めることはできません。\nDo not include parentheses or numbers in the name.');
    return;
  }
  
  showModal('保存中... / Saving...', true);
  google.script.run.withSuccessHandler(function(msg) { 
    showModal(msg, false, true);
    const searchIdEl = document.getElementById('searchIdAddInfo');
    if (searchIdEl && searchIdEl.value.trim() && candidateDict) {
      const editId = formatId(toHalfWidthNumber(searchIdEl.value.trim())).replace(/\s/g, '').toUpperCase();
      if (candidateDict[editId]) {
        if (formData.name) candidateDict[editId].name = formData.name;
        if (formData.birthday) candidateDict[editId].birthday = formData.birthday;
      }
    }
    google.script.run.syncListSheets();
  }).updateAddInfoRow(formData);
}
</script>
