<div id="form-entry-date" style="display: <?= mode === 'ENTRY_DATE' ? 'block' : 'none' ?>;">

<div class="field">
  <label>対象の案件ID</label>
  <div style="display: flex; gap: 10px;">
    <input type="text" id="entryDate_job_id" placeholder="例: 1 または 0001" oninput="checkJobId(this, 'entryDateJobDisplay')" onblur="applyJobFormat(this)" style="flex: 2;">
    <button class="btn-secondary" style="flex: 1; margin-top: 0; padding: 8px;" onclick="fetchEntryDateCandidates()">採用者検索</button>

  <div id="entryDateJobDisplay" style="font-size:11px; color:#34a853; margin-top:4px; height:14px;"></div>

      <label style="font-size: 12px;">共通の入国日</label>

    <div class="field">
      <label style="font-size: 12px;">共通の入職日</label>
      <input type="date" id="bulk_workDate" oninput="applyBulkDate('work', this.value)">

  </div>
</div>

  </div>
</div>

<div style="text-align: center; margin-top: 25px;">
