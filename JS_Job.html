<script>
// =========================================
// 案件登録 (JOB) および案件画面共通の行追加関数
// =========================================

function addJobFileRow(prefix, urlVal = '') {
  const containerId = prefix + '_file_list';
  const container = document.getElementById(containerId);
  if (!container) return;
  const className = prefix + '-file-input';
  
  const html = `<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
    <input type="text" class="${className}" placeholder=" URLを直接入力、または検索 " value="${urlVal}" style="flex: 1; padding: 6px; box-sizing: border-box; height: 30px; margin: 0;">
    <button type="button" class="btn-secondary" onclick="openDrivePicker(this)" style="margin: 0; padding: 4px 10px; font-size: 11px; height: 30px; width: auto; flex-shrink: 0;">ドライブ検索</button>
    <button type="button" class="btn-delete-small" onclick="this.parentElement.remove()" style="height: 30px;">削除</button>
  </div>`;
  container.insertAdjacentHTML('beforeend', html);
}

function addJobCandRow() {
  const listEl = document.getElementById('job_cand_list');
  if(listEl) listEl.insertAdjacentHTML('beforeend', createCandRowHTML('job-cand-id'));
}

function addJobCompanyRow(listId, val = '') {
  const container = document.getElementById(listId);
  if (!container) return;
  
  const placeholderText = isCompanyLoading ? "事業者辞書を取得中..." : "例：株式会社〇〇";
  const disabledAttr = isCompanyLoading ? "disabled" : "";

  const html = `<div style="position: relative; display: flex; gap: 10px; margin-bottom: 8px;">
      <input type="text" class="job-company-input" placeholder="${placeholderText}" value="${val}" autocomplete="off" oninput="showCompanySuggest(this)" onfocus="showCompanySuggest(this)" style="flex: 1;" ${disabledAttr}>
      <button type="button" class="btn-delete-small" onclick="if(this.parentElement.parentElement.children.length > 1) this.parentElement.remove()" style="height: 30px;">削除</button>
    </div>`;
  container.insertAdjacentHTML('beforeend', html);
}

async function submitJob() {
  let compInputs = document.querySelectorAll('#job_company_list .job-company-input');
  let companies = [];
  let unlistedCompanies = [];

  compInputs.forEach(input => {
    let val = input.value.normalize('NFC').trim();
    input.value = val;
    if (val) {
      companies.push(val);
      if (!companyListArray.includes(val)) {
        unlistedCompanies.push(val);
      }
    }
  });

  if (companies.length === 0) { showModal('事業者名を入力してください。'); return; }

  if (unlistedCompanies.length > 0) {
    showModal(`未登録の事業者が含まれています：\n「${unlistedCompanies.join('」「')}」\n\n先に管理者へ連絡し、事業者マスタへの登録を依頼してください。`);
    return;
  }
  
  let candListEl = document.getElementById('job_cand_list');
  let candInputDivs = candListEl ? candListEl.children : []; 
  let candidates = [];
  let unlistedCands = [];
  let hiredCands = [];

  Array.from(candInputDivs).forEach(div => { 
    let inputEl = div.querySelector('input.job-cand-id');
    if (inputEl && inputEl.value.trim()) {
      let idStr = formatId(inputEl.value.trim());
      let lookupId = idStr.replace(/\s/g, '').toUpperCase();
      
      let candData = candidateDict[lookupId];
      if (!candData) {
        unlistedCands.push(idStr);
      } else {
        if (candData.status === '採用') {
          hiredCands.push(`${idStr} (${candData.name})`);
        }
        candidates.push(`${idStr}-${candData.name}`);
      }
    } 
  });

  if (unlistedCands.length > 0) {
    showModal(`未登録の候補者IDが含まれています：\n「${unlistedCands.join('」「')}」\n\n正しいIDを入力してください。`);
    return;
  }
  if (hiredCands.length > 0) {
    showModal(`以下の候補者は既に他の案件で「採用」となっているため、登録できません：\n\n${hiredCands.join('\n')}`);
    return;
  }
  if (candidates.length === 0) { showModal('候補者を少なくとも1名入力してください。'); return; }
  
  let fileInputs = document.querySelectorAll('.job-file-input');
  let relatedFiles = [];
  fileInputs.forEach(input => {
    let val = input.value.trim();
    if(val) relatedFiles.push(val);
  });

  let uploadFiles = [];
  let fileInputEl = document.getElementById('job_upload_files');
  if (fileInputEl && fileInputEl.files.length > 0) {
    showModal('ファイルを読み込み中...', true);
    for (let i = 0; i < fileInputEl.files.length; i++) {
      let file = fileInputEl.files[i];
      try {
        let base64 = await new Promise((resolve, reject) => {
          let reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result.split(',')[1]);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(file);
        });
        uploadFiles.push({
          name: file.name.normalize('NFC'),
          mimeType: file.type,
          data: base64
        });
      } catch (err) {
        showModal('ファイルの読み込みに失敗しました: ' + file.name);
        return;
      }
    }
  }

  let skillEl = document.getElementById('job_skill');
  let statusEl = document.getElementById('job_status');
  let interviewDateEl = document.getElementById('job_interviewDate');
  let memoEl = document.getElementById('job_memo');

  let formData = {
    companies: companies,
    status: statusEl ? statusEl.value : '未着手',
    skill: skillEl ? skillEl.value : '',
    candidates: candidates,
    interviewDate: interviewDateEl ? interviewDateEl.value : '',
    relatedFiles: relatedFiles,
    uploadFiles: uploadFiles,
    memo: memoEl ? memoEl.value.normalize('NFC') : ''
  };
  
  let btnEl = document.getElementById('jobBtn');
  if(btnEl) btnEl.disabled = true; 
  
  if (uploadFiles.length > 0) {
    showModal('案件を登録し、フォルダを作成中...', true);
  } else {
    showModal('案件を登録中...', true);
  }
  
  google.script.run
    .withSuccessHandler(function(msg) {
      try {
        if(btnEl) btnEl.disabled = false; 
        
        let jobIdMatch = msg.match(/JOB-\d+/);
        let newJobId = jobIdMatch ? jobIdMatch[0] : null;
        showModal(msg, false, true, newJobId ? {type: 'JOB_ADDED', jobId: newJobId} : null);
        
        if(statusEl) statusEl.value = '未着手';
        if(skillEl) skillEl.value = '';
        if(interviewDateEl) interviewDateEl.value = '';
        if(memoEl) memoEl.value = '';
        if(fileInputEl) fileInputEl.value = '';
        
        let compListEl = document.getElementById('job_company_list');
        if(compListEl) {
          compListEl.innerHTML = '';
          addJobCompanyRow('job_company_list');
        }

        let fileListEl = document.getElementById('job_file_list');
        if(fileListEl) {
           fileListEl.innerHTML = ''; 
           addJobFileRow('job');
        }
        let candListEl = document.getElementById('job_cand_list');
        if(candListEl) {
           candListEl.innerHTML = createCandRowHTML('job-cand-id');
        }
      } catch(frontendErr) {
        showModal('登録は完了しましたが、画面の初期化に失敗しました。画面を閉じてください。');
      }
    })
    .withFailureHandler(function(err) {
      if(btnEl) btnEl.disabled = false; 
      showModal('サーバーエラー: ' + err.message);
    })
    .addJob(formData);
}

window.addEventListener('DOMContentLoaded', () => {
  if (MODE === 'JOB') {
    addJobCandRow();
    addJobFileRow('job');
    addJobCompanyRow('job_company_list');
  }
});
</script>
